; El codigo esta en mando_joystick/mando_joystick.ino para que se abra
; igual en el Arduino IDE (la carpeta y el .ino tienen que llamarse igual).

[platformio]
src_dir = mando_joystick

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
lib_deps = mheironimus/Joystick
upload_port = /dev/ttyACM*
