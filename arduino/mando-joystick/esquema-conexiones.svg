<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" font-family="Arial, Helvetica, sans-serif" role="img">
  <title>Esquema de conexiones del arcade stick</title>
  <desc>Keyestudio Leonardo con 4 botones arcade: cable rojo de cada boton a los pines 2 a 5, cables negros a la fila negativa de la protoboard, que va a GND. Palanca de arcade de 4 microinterruptores en A2 (arriba), A3 (abajo), A4 (izquierda) y A5 (derecha), con el comun a GND.</desc>
  <rect width="900" height="720" fill="#FFFFFF"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#222">Arcade stick · esquema de conexiones</text>
  <text x="30" y="60" font-size="13" fill="#555">Keyestudio Leonardo (KS0248) · 4 botones arcade y palanca digital · firmware mando_joystick.ino</text>

  <!-- Placa -->
  <rect x="360" y="72" width="44" height="30" rx="3" fill="#B4B2A9" stroke="#5F5E5A"/>
  <text x="382" y="122" font-size="11" fill="#D3D1C7" text-anchor="middle">USB al PC</text>
  <rect x="270" y="100" width="220" height="530" rx="10" fill="#1E1E1E" stroke="#000"/>
  <text x="380" y="210" font-size="15" font-weight="bold" fill="#F2D21B" text-anchor="middle">LEONARDO</text>
  <text x="380" y="228" font-size="11" fill="#D3D1C7" text-anchor="middle">keyestudio KS0248</text>
  <rect x="345" y="400" width="70" height="70" rx="4" fill="#333" stroke="#777"/>
  <text x="380" y="439" font-size="10" fill="#D3D1C7" text-anchor="middle">ATmega32U4</text>

  <!-- Conector derecho (digital) -->
  <rect x="472" y="140" width="16" height="240" fill="#F2D21B"/>
  <rect x="472" y="392" width="16" height="192" fill="#F2D21B"/>
  <g font-size="11" fill="#D3D1C7" text-anchor="end">
    <text x="464" y="154">SCL</text><text x="464" y="178">SDA</text><text x="464" y="202">AREF</text>
    <text x="464" y="226" fill="#FFFFFF" font-weight="bold">GND</text>
    <text x="464" y="250">13</text><text x="464" y="274">12</text><text x="464" y="298">11</text>
    <text x="464" y="322">10</text><text x="464" y="346">9</text><text x="464" y="370">8</text>
    <text x="464" y="408">7</text><text x="464" y="432">6</text>
    <text x="464" y="456" fill="#FFFFFF" font-weight="bold">5</text><text x="464" y="480" fill="#FFFFFF" font-weight="bold">4</text>
    <text x="464" y="504" fill="#FFFFFF" font-weight="bold">3</text><text x="464" y="528" fill="#FFFFFF" font-weight="bold">2</text>
    <text x="464" y="552">TX 1</text><text x="464" y="576">RX 0</text>
  </g>
  <g fill="#222">
    <rect x="476" y="146" width="8" height="8"/><rect x="476" y="170" width="8" height="8"/><rect x="476" y="194" width="8" height="8"/>
    <rect x="476" y="218" width="8" height="8"/><rect x="476" y="242" width="8" height="8"/><rect x="476" y="266" width="8" height="8"/>
    <rect x="476" y="290" width="8" height="8"/><rect x="476" y="314" width="8" height="8"/><rect x="476" y="338" width="8" height="8"/>
    <rect x="476" y="362" width="8" height="8"/>
    <rect x="476" y="400" width="8" height="8"/><rect x="476" y="424" width="8" height="8"/><rect x="476" y="448" width="8" height="8"/>
    <rect x="476" y="472" width="8" height="8"/><rect x="476" y="496" width="8" height="8"/><rect x="476" y="520" width="8" height="8"/>
    <rect x="476" y="544" width="8" height="8"/><rect x="476" y="568" width="8" height="8"/>
  </g>

  <!-- Conector izquierdo (alimentacion y palanca) -->
  <rect x="272" y="290" width="16" height="168" fill="#F2D21B"/>
  <rect x="272" y="470" width="16" height="144" fill="#F2D21B"/>
  <g font-size="11" fill="#D3D1C7">
    <text x="296" y="304">IOREF</text><text x="296" y="328">RESET</text><text x="296" y="352">3.3V</text>
    <text x="296" y="376">5V</text>
    <text x="296" y="400" fill="#FFFFFF" font-weight="bold">GND</text><text x="296" y="424">GND</text><text x="296" y="448">Vin</text>
    <text x="296" y="486">A0</text><text x="296" y="510">A1</text>
    <text x="296" y="534" fill="#FFFFFF" font-weight="bold">A2</text><text x="296" y="558" fill="#FFFFFF" font-weight="bold">A3</text><text x="296" y="582" fill="#FFFFFF" font-weight="bold">A4</text><text x="296" y="606" fill="#FFFFFF" font-weight="bold">A5</text>
  </g>
  <g fill="#222">
    <rect x="276" y="296" width="8" height="8"/><rect x="276" y="320" width="8" height="8"/><rect x="276" y="344" width="8" height="8"/>
    <rect x="276" y="368" width="8" height="8"/><rect x="276" y="392" width="8" height="8"/><rect x="276" y="416" width="8" height="8"/>
    <rect x="276" y="440" width="8" height="8"/>
    <rect x="276" y="478" width="8" height="8"/><rect x="276" y="502" width="8" height="8"/><rect x="276" y="526" width="8" height="8"/>
    <rect x="276" y="550" width="8" height="8"/><rect x="276" y="574" width="8" height="8"/><rect x="276" y="598" width="8" height="8"/>
  </g>

  <!-- Fila negativa de la protoboard -->
  <rect x="788" y="196" width="24" height="420" rx="3" fill="#F4F1E6" stroke="#B4B2A9"/>
  <line x1="806" y1="200" x2="806" y2="612" stroke="#378ADD" stroke-width="2"/>
  <text x="800" y="636" font-size="12" fill="#222" text-anchor="middle">Fila − (azul)</text>
  <text x="800" y="652" font-size="12" fill="#222" text-anchor="middle">de la protoboard</text>

  <!-- GND de la placa a la fila negativa -->
  <polyline points="488,222 798,222" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <circle cx="798" cy="222" r="4" fill="#222"/>
  <text x="640" y="214" font-size="12" fill="#222" text-anchor="middle">GND → fila −</text>

  <!-- Cables rojos: pin -> boton -->
  <g fill="none" stroke="#D62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <polyline points="488,452 570,452 570,396 660,396"/>
    <polyline points="488,476 595,476 595,460 660,460"/>
    <polyline points="488,500 545,500 545,524 660,524"/>
    <polyline points="488,524 520,524 520,588 660,588"/>
  </g>

  <!-- Cables negros: boton -> fila negativa -->
  <g fill="none" stroke="#222" stroke-width="3" stroke-linecap="round">
    <line x1="700" y1="396" x2="798" y2="396"/><line x1="700" y1="460" x2="798" y2="460"/>
    <line x1="700" y1="524" x2="798" y2="524"/><line x1="700" y1="588" x2="798" y2="588"/>
  </g>
  <g fill="#222">
    <circle cx="798" cy="396" r="4"/>
    <circle cx="798" cy="460" r="4"/><circle cx="798" cy="524" r="4"/><circle cx="798" cy="588" r="4"/>
  </g>

  <!-- Botones -->
  <g stroke="#333" stroke-width="1.5">
    <circle cx="680" cy="396" r="20" fill="#2F80D1"/>
    <circle cx="680" cy="460" r="20" fill="#D62828"/>
    <circle cx="680" cy="524" r="20" fill="#2F80D1"/>
    <circle cx="680" cy="588" r="20" fill="#D62828"/>
  </g>
  <g font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="680" y="401">4</text>
    <text x="680" y="465">3</text><text x="680" y="529">2</text><text x="680" y="593">1</text>
  </g>
  <g font-size="11" fill="#444" text-anchor="middle">
    <text x="680" y="370">Botón 4 · pin 5</text><text x="680" y="434">Botón 3 · pin 4</text>
    <text x="680" y="498">Botón 2 · pin 3</text><text x="680" y="562">Botón 1 · pin 2</text>
  </g>

  <!-- Palanca digital de arcade (Sanwa JLF: 4 microinterruptores), la unica que lee el firmware -->
  <text x="40" y="340" font-size="13" font-weight="bold" fill="#222">Palanca de arcade</text>
  <text x="40" y="356" font-size="11" fill="#666">Sanwa JLF · 4 microinterruptores · pendiente</text>
  <rect x="40" y="362" width="150" height="256" rx="8" fill="#F7F7F7" stroke="#888" stroke-dasharray="6 4"/>
  <circle cx="92" cy="466" r="26" fill="#D62828" stroke="#7a1010"/>
  <rect x="88" y="490" width="8" height="34" fill="#555"/>
  <g font-size="11" fill="#444" text-anchor="end">
    <text x="182" y="400">Común (GND)</text>
    <text x="182" y="534">Arriba</text><text x="182" y="558">Abajo</text>
    <text x="182" y="582">Izquierda</text><text x="182" y="606">Derecha</text>
  </g>
  <g fill="none" stroke-width="2.5" stroke-dasharray="7 4">
    <line x1="190" y1="396" x2="276" y2="396" stroke="#222"/>
    <line x1="190" y1="530" x2="276" y2="530" stroke="#1D9E75"/>
    <line x1="190" y1="554" x2="276" y2="554" stroke="#1D9E75"/>
    <line x1="190" y1="578" x2="276" y2="578" stroke="#1D9E75"/>
    <line x1="190" y1="602" x2="276" y2="602" stroke="#1D9E75"/>
  </g>

  <!-- Leyenda -->
  <line x1="40" y1="684" x2="70" y2="684" stroke="#D62828" stroke-width="3"/>
  <text x="78" y="688" font-size="12" fill="#222">Cable rojo del botón → pin digital</text>
  <line x1="300" y1="684" x2="330" y2="684" stroke="#222" stroke-width="3"/>
  <text x="338" y="688" font-size="12" fill="#222">Cable negro → GND común</text>
  <line x1="520" y1="684" x2="550" y2="684" stroke="#888" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="558" y="688" font-size="12" fill="#222">Pendiente (palanca)</text>
  <text x="40" y="708" font-size="11" fill="#666">Conectores blancos JST: meter un dupont macho en cada agujero. No usar los pines 0 y 1. Sin resistencias: el código usa INPUT_PULLUP.</text>
</svg>
