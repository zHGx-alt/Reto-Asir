<text font-family="Helvetica, Arial, sans-serif" font-size="58" fill="#333333" text-anchor="start" font-weight="bold"><tspan x="60" y="355.1">Tradición</tspan><tspan x="60" y="417.7">que se</tspan><tspan x="60" y="480.4">mueve.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start"><tspan x="60" y="523.3">Una cadena nacida en Bilbao para</tspan><tspan x="60" y="543.6">acercar el producto vasco a una</tspan><tspan x="60" y="563.9">mesa actual, directa y sin artificios.</tspan></text>
