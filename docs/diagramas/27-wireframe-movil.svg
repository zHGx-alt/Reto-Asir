<text font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#333333" text-anchor="start" font-weight="bold"><tspan x="60" y="1298.0">Menos</tspan><tspan x="60" y="1341.2">decoración.</tspan><tspan x="60" y="1384.4">Más sabor.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#333333" text-anchor="start"><tspan x="60" y="1425.2">Trabajamos con recetas reconocibles,</tspan><tspan x="60" y="1448.4">proveedores cercanos y una mirada</tspan><tspan x="60" y="1471.6">contemporánea.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333333" text-anchor="start"><tspan x="60" y="1512.3">Almi Chain propone espacios diferentes</tspan><tspan x="60" y="1531.2">con una misma idea: que cada plato</tspan><tspan x="60" y="1550.0">tenga un origen claro y que cada visita</tspan><tspan x="60" y="1568.9">se sienta cercana.</tspan></text>
