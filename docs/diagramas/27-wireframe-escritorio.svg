<text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#333333" text-anchor="start" font-weight="bold"><tspan x="104" y="1471.4">NUESTRA MANERA DE HACER</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="58" fill="#333333" text-anchor="start" font-weight="bold"><tspan x="104" y="1545.1">Menos decoración.</tspan><tspan x="104" y="1607.7">Más sabor.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#333333" text-anchor="start"><tspan x="955" y="1529.0">Trabajamos con recetas reconocibles,</tspan><tspan x="955" y="1558.0">proveedores cercanos y una mirada</tspan><tspan x="955" y="1587.0">contemporánea.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333333" text-anchor="start"><tspan x="955" y="1633.3">Almi Chain propone espacios diferentes con una misma</tspan><tspan x="955" y="1653.6">idea: que cada plato tenga un origen claro y que</tspan><tspan x="955" y="1673.9">cada visita se sienta cercana.</tspan></text>
