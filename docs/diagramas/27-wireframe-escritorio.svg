<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start"><tspan x="1588" y="1457.2">Historia: titular a la izquierda y texto</tspan><tspan x="1588" y="1477.5">a la derecha, alineados abajo.</tspan></text>
<line x1="1486" y1="1954" x2="1544" y2="1954" stroke="#c2410c" stroke-dasharray="6 4"/>
<circle cx="1564" cy="1954" r="14" fill="#c2410c" stroke="none"/>
