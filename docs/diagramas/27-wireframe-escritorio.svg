<text font-family="Helvetica, Arial, sans-serif" font-size="76" fill="#333333" text-anchor="start" font-weight="bold"><tspan x="104" y="382.2">Tradición que</tspan><tspan x="104" y="464.3">se mueve.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" text-anchor="start"><tspan x="1021" y="634.2">Una cadena nacida en Bilbao para</tspan><tspan x="1021" y="656.0">acercar el producto vasco a una</tspan><tspan x="1021" y="677.8">mesa actual, directa y sin artificios.</tspan></text>
<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#333333" text-anchor="start" font-weight="bold"><tspan x="1021" y="724.2">Ver platos estrella ↘</tspan></text>
