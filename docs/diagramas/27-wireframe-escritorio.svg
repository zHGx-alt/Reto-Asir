<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start"><tspan x="1588" y="1957.2">Platos estrella: fondo oscuro. Carrusel</tspan><tspan x="1588" y="1977.5">de 3 platos con flechas y contador;</tspan><tspan x="1588" y="1997.8">pie con número, nombre y descripción.</tspan></text>
