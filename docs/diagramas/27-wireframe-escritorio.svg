<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start"><tspan x="1588" y="257.2">Portada: titular grande; texto y enlace</tspan><tspan x="1588" y="277.5">a la derecha. Imagen grande con pie</tspan><tspan x="1588" y="297.8">vertical y un «01» decorativo detrás.</tspan></text>
