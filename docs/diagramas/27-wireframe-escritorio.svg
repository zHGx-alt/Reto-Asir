<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start"><tspan x="1588" y="107.2">Cabecera: logo a la izquierda y menú de</tspan><tspan x="1588" y="127.5">anclas a la derecha. «Contacto»</tspan><tspan x="1588" y="147.8">destacado en color.</tspan></text>
