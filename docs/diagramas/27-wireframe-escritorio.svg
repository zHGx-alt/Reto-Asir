<text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start"><tspan x="1588" y="2657.2">Ubicación: zona, horario y teléfono;</tspan><tspan x="1588" y="2677.5">«Cómo llegar» y «Usar mi ubicación»</tspan><tspan x="1588" y="2697.8">(la geolocalización exige HTTPS).</tspan><tspan x="1588" y="2718.0">Mapa de OpenStreetMap con insignia.</tspan></text>
