# Tarea 52 · Proxy HTTPS delante de Odoo. Se suma al docker-compose.yml de la tarea 33:
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
# (activar-https.sh lo deja fijo con COMPOSE_FILE en .env, así cualquier "docker compose up" lo incluye).
services:
  odoo:
    # Odoo deja de escuchar en la LAN: solo lo ve el proxy (red "interna") y el propio servidor.
    # "!override" sustituye la lista de puertos del fichero base en vez de sumarla (Compose 2.24 o posterior).
    ports: !override
      - "127.0.0.1:8069:8069"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [odoo]
    ports:
      - "80:80"     # solo redirige a HTTPS
      - "443:443"
    volumes:
      - ./https/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./https/certs:/etc/nginx/certs:ro
    networks: [interna]
