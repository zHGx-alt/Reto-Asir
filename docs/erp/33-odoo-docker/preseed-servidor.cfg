### Preseed para instalar Debian 13 del servidor ERP sin intervención (tarea 33)
### Equivale a contestar a mano el instalador como se explica en el README.

# Idioma, teclado y zona horaria
d-i debian-installer/locale string es_ES.UTF-8
d-i keyboard-configuration/xkb-keymap select es
d-i console-setup/ask_detect boolean false
d-i time/zone string Europe/Madrid
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Red
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string servidor-erp
d-i netcfg/get_domain string

# Réplica
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false

# Usuarios: sin root, así "tecnico" recibe sudo
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Administrador
d-i passwd/username string tecnico
d-i passwd/user-password password @@VBOX_INSERT_USER_PASSWORD@@
d-i passwd/user-password-again password @@VBOX_INSERT_USER_PASSWORD@@

# Particionado: todo el disco, una sola partición
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Programas: SIN entorno de escritorio, solo utilidades estándar + SSH
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda
d-i finish-install/reboot_in_progress note

# Clave SSH para administrar la máquina en remoto sin contraseña
d-i preseed/late_command string mkdir -p /target/home/tecnico/.ssh;  echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJld4fLQOvSCvJ7irFTHiAei/yqTLhImY8lGHaNvs5/3 recreativa-claude' > /target/home/tecnico/.ssh/authorized_keys;  in-target chown -R tecnico:tecnico /home/tecnico/.ssh;  in-target chmod 700 /home/tecnico/.ssh;  in-target chmod 600 /home/tecnico/.ssh/authorized_keys
