# Tarea 31 · Publica web/ en el bucket S3 cuando cambia en main. La EC2 la descarga sola cada 5 minutos.
# Credenciales: las del Learner Lab (AWS Details → AWS CLI), guardadas como secretos del repositorio:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY y AWS_SESSION_TOKEN. Caducan con cada sesión del laboratorio:
#   antes de publicar hay que actualizarlas (Settings → Secrets and variables → Actions).
# Sin secretos, el trabajo avisa y termina sin error (así no falla el CI de quien no tiene acceso a AWS).
name: desplegar-web

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desplegar-web
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: Formato y validación de Terraform
        working-directory: iac
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  publicar:
    needs: validar
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: almi-chain-web-2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Publicar en S3
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::Sin credenciales de AWS en los secretos: no se publica (ver la cabecera del workflow)."
            exit 0
          fi
          aws sts get-caller-identity --query Arn --output text
          aws s3 sync web/ "s3://$BUCKET/" --delete --exclude "README.txt" --exclude ".gitkeep"
          echo "Publicado. La EC2 lo descarga en menos de 5 minutos (o al momento con: sudo actualizar-web)."
